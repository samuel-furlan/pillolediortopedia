<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pillole">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icona-180.png">
<link rel="manifest" href="manifest.json">
<title>Pillole di ortopedia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#f5f5f7; --card:#ffffff; --ink:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.08);
    --sheet:#ffffff; --chip:rgba(0,0,0,.05); --blue:#0071e3; --green:#30a14e; --red:#e5484d; --orange:#f59e0b;
    --shadow:0 10px 30px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#000; --card:#1c1c1e; --ink:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.1);
      --sheet:#1c1c1e; --chip:rgba(255,255,255,.08); --blue:#2997ff; --green:#30d158; --red:#ff453a; --orange:#ff9f0a;
      --shadow:0 10px 30px rgba(0,0,0,.5); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45}
  button{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 20px 60px}

  /* barra in alto */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .iconbtn{position:relative;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
    background:var(--card);box-shadow:var(--shadow);color:var(--blue)}
  .iconbtn svg{width:22px;height:22px}
  .iconbtn .badge-n{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 6px;border-radius:10px;
    background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center;display:none}
  .iconbtn .badge-n.show{display:block}
  .iconbtn .dot-n{position:absolute;top:1px;right:1px;width:12px;height:12px;border-radius:50%;background:var(--red);border:2px solid var(--card);display:none}
  .iconbtn .dot-n.show{display:block}
  .topright{display:flex;gap:10px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
  .date{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:2px}
  .badge{flex:none;height:44px;padding:0 14px;border-radius:22px;display:grid;place-items:center;font-weight:700;font-size:14px;
    background:linear-gradient(135deg,#ff9f0a,#ff375f 50%,#5e5ce6);color:#fff;box-shadow:var(--shadow);white-space:nowrap}
  .back{display:none;margin:-8px 0 18px;font-weight:600;font-size:15px;color:var(--blue);background:none;border:0;cursor:pointer;padding:6px 0}
  .back.show{display:inline-block}

  .grid{display:grid;grid-template-columns:1fr;gap:22px}
  @media (min-width:720px){ .grid{grid-template-columns:1fr 1fr} }

  /* schede */
  .card{position:relative;border-radius:24px;overflow:hidden;height:460px;color:#fff;cursor:pointer;box-shadow:var(--shadow);
    display:flex;flex-direction:column;justify-content:space-between;padding:24px;border:0;text-align:left;
    transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .card:active{transform:scale(.97)}
  @media (hover:hover){ .card:hover{transform:translateY(-3px) scale(1.01)} }
  .card .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .card .title{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-top:6px;text-wrap:balance}
  .card .sub{font-size:16px;font-weight:500;opacity:.88;margin-top:8px}
  .card .foot{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card .teaser{font-size:15px;opacity:.92;max-width:34ch}
  .card .more{flex:none;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-radius:999px;padding:8px 16px;font-size:14px;font-weight:700}
  .card .top{position:relative;z-index:1}


  /* liste */
  .section-h{font-size:24px;font-weight:800;letter-spacing:-.01em;margin:46px 0 14px}
  .list{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .row{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);width:100%;
    background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer}
  .row:last-child{border-bottom:0}
  .row .num{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700;color:#fff;
    background:linear-gradient(135deg,#ff9f0a,#ff375f 50%,#5e5ce6)}
  .row .meta{flex:1;min-width:0}
  .row .d{font-weight:700;font-size:15px}
  .row .s{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .chev{color:var(--muted);font-size:20px}
  .pill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px}
  .pill.ok{background:rgba(48,209,88,.16);color:var(--green)}
  .pill.todo{background:rgba(255,159,10,.16);color:var(--orange)}
  .pill.ko{background:rgba(255,69,58,.14);color:var(--red)}
  .empty{padding:18px;color:var(--muted);font-size:15px}

  /* foglio */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .3s;z-index:10}
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;top:0;margin:0 auto;max-width:760px;background:var(--sheet);z-index:11;
    overflow-y:auto;-webkit-overflow-scrolling:touch;transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:720px){ .sheet{top:40px;bottom:40px;border-radius:26px;transform:translateY(calc(100% + 60px))} }
  .sheet{visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s linear .45s}
  .sheet.open{transform:translateY(0);visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
  .hero{position:relative;color:#fff;padding:64px 26px 30px;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
  .hero .eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85;position:relative}
  .hero .title{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.08;margin-top:6px;position:relative;text-wrap:balance}
  .hero .sub{font-size:17px;opacity:.9;margin-top:8px;position:relative}
  .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;z-index:3;
    background:rgba(0,0,0,.28);color:#fff;font-size:18px;line-height:34px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  .close.fixed{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:12;display:none;width:36px;height:36px;line-height:36px;
    background:rgba(0,0,0,.45);box-shadow:0 2px 10px rgba(0,0,0,.25)}
  .close.fixed.show{display:block}
  @media (min-width:720px){ .close.fixed{top:54px;right:calc(50vw - 380px + 14px)} }
  .body{padding:24px 26px 50px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .chip{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
  .block{margin-bottom:22px}
  .block h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .block p{font-size:17px;line-height:1.55}
  .tip{border-radius:18px;padding:16px 18px;background:var(--chip)}
  .tip h3{color:var(--accent,#999)}

  /* fogli di servizio (calendario, quiz) */
  .plainhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;
    background:var(--sheet);border-bottom:1px solid var(--line)}
  .plainhead h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .plainhead .x{width:32px;height:32px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:16px}
  .pad{padding:20px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
  .tile{background:var(--chip);border-radius:16px;padding:14px 12px}
  .tile .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
  .tile .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .bigbtn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;
    background:var(--blue);color:#fff;margin-bottom:10px}
  .bigbtn.sec{background:var(--chip);color:var(--ink)}
  .bigbtn:disabled{opacity:.4;cursor:default}
  .bigbtn:focus,.opt:focus{outline:none}
  .bigbtn:focus-visible,.opt:focus-visible{outline:3px solid rgba(0,113,227,.4);outline-offset:2px}
  .newhero{border-radius:20px;padding:22px;margin-bottom:18px;color:#fff;background:radial-gradient(120% 90% at 100% 0%,#ffd60a 0%,transparent 55%),linear-gradient(150deg,#ff9f0a,#ff375f 50%,#5e5ce6)}
  .nh-t{font-size:22px;font-weight:800;letter-spacing:-.01em}
  .nh-s{font-size:15px;opacity:.92;margin-top:6px}
  .steps{margin-bottom:16px}
  .step{display:flex;gap:12px;align-items:center;padding:10px 0;font-size:16px;border-bottom:1px solid var(--line)}
  .step:last-child{border-bottom:0}
  .step b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-size:14px}
  .nh-note{font-size:14px;color:var(--muted);margin-top:8px;text-align:center}

  /* calendario */
  .calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .calnav b{font-size:19px;text-transform:capitalize}
  .calnav button{width:36px;height:36px;border-radius:50%;border:0;background:var(--chip);cursor:pointer;font-size:18px;color:var(--blue)}
  .calhead,.calrow{display:grid;grid-template-columns:repeat(7,1fr) 28px;align-items:center}
  .calhead span{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:6px 0}
  .calrow{border-radius:14px;margin-bottom:4px;padding:2px 0}
  .calrow.ok{background:rgba(48,209,88,.13)}
  .calrow.cur{outline:2px solid var(--line);outline-offset:-2px}
  .calmark{text-align:center;font-weight:800;color:var(--green)}
  .calday{position:relative;text-align:center;font-size:15px;font-weight:600;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .calday span{display:inline-block;width:34px;height:34px;line-height:34px;border-radius:50%}
  .calday.out{color:var(--muted);opacity:.45}
  .calday.today span{outline:2px solid var(--red);outline-offset:-2px}
  .calday.has{cursor:pointer}
  .calday.done span{background:var(--green);color:#fff}
  .calday.todo span{background:rgba(255,159,10,.2);color:var(--orange)}
  .calday .dot{display:none}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px;color:var(--muted)}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}


  /* ---- aggiunte per gli articoli ---- */
  .areabar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 22px}
  .areapill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;color:#fff}
  .areapill svg{width:18px;height:18px}
  .areapill.mano{background:linear-gradient(135deg,#ff9f0a,#ff375f)}
  .areapill.generale{background:linear-gradient(135deg,#0a84ff,#5e5ce6)}
  .areapill.ginocchio-piede{background:linear-gradient(135deg,#30d158,#00a389 45%,#6e4fe0)}
  .areanote{font-size:14px;color:var(--muted)}
  .grouph{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:8px 0 -8px}
  .grouph:first-child{margin-top:0}
  .grouph b{font-size:20px;font-weight:800;letter-spacing:-.01em}
  .grouph span{font-size:14px;color:var(--muted);font-weight:600}
  .card.art{height:auto;min-height:400px}
  .card.art .foot{margin-top:18px}
  .card .bigic{position:absolute;right:-26px;bottom:44px;width:220px;height:220px;opacity:.17;pointer-events:none;color:#fff}
  .card .bigic svg,.hero .bigic svg{width:100%;height:100%}
  .card .loe{position:absolute;top:20px;right:20px;z-index:1;min-width:46px;height:46px;padding:0 8px;border-radius:23px;display:grid;place-items:center;
    background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-weight:800;font-size:15px;line-height:1.05;text-align:center}
  .card .loe small{display:block;font-size:9px;font-weight:700;letter-spacing:.08em;opacity:.85}
  .card.art .top{padding-right:58px}
  .card.art .title{font-size:27px}
  .card.art .sub{font-size:15px}
  .hero .bigic{position:absolute;right:-20px;top:-10px;width:250px;height:250px;opacity:.16;color:#fff}
  .hero .src{font-size:14px;opacity:.85;margin-top:12px;position:relative}
  .tip{border-radius:18px;padding:16px 18px;background:var(--chip);margin-bottom:22px}
  .tip h3{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent,#999);margin-bottom:6px}
  .tip p{font-size:17px;line-height:1.55}
  .tip.main{background:color-mix(in srgb,var(--accent,#999) 14%,transparent)}
  .tip.main p{font-weight:600}
  .fonte{border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
  .fonte .foh{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .fonte .ot{font-size:15px;font-style:italic;line-height:1.45;margin-bottom:6px}
  .fonte .oc{font-size:14px;color:var(--muted);margin-bottom:12px}
  .links{display:flex;gap:10px;flex-wrap:wrap}
  .links a{display:inline-block;text-decoration:none;font-size:14px;font-weight:700;border-radius:999px;padding:8px 14px;background:var(--chip);color:var(--blue)}
  .nota{font-size:12px;color:var(--muted);margin-top:14px}
  .calday.slotm span{box-shadow:inset 0 -3px 0 #00a389}
  .calday.slotg span{box-shadow:inset 0 -3px 0 #0a84ff}
  .calmark.half{color:var(--orange)}
  .card .weak{display:inline-block;margin-top:10px;font-size:13px;font-weight:800;padding:5px 10px;border-radius:999px;background:#ffd60a;color:#1d1d1f}
  .chip.aff-alta{background:rgba(48,209,88,.16);color:var(--green)}
  .chip.aff-moderata{background:rgba(10,132,255,.14);color:var(--blue)}
  .chip.aff-bassa{background:#ffd60a;color:#1d1d1f;font-weight:800}
  .tip.aff h3{color:var(--muted)}
  .tip.aff.bassa{background:rgba(255,214,10,.22)}
  .tip.aff.bassa h3{color:#b25000}
  .tiphead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .tiphead h3{margin:0}
  .expbtn{flex:none;border:0;cursor:pointer;font:700 13px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;border-radius:999px;padding:7px 12px;
    background:var(--accent,#0a84ff);color:#fff;display:inline-flex;align-items:center;gap:5px}
  .expbtn span{font-size:12px}
  .tip .esteso{display:none;margin-top:14px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--accent,#999) 30%,transparent)}
  .tip.open .esteso{display:block;animation:fadein .25s ease}
  .tip .esteso p{font-weight:400;margin:0 0 12px}
  .tip .esteso p:last-child{margin-bottom:0}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .fbar{margin:0 0 12px;border-radius:16px;background:var(--chip)}
  .fhead{display:flex;align-items:center;gap:10px;padding:8px 10px;min-height:44px}
  .fbtn{flex:none;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 12px;background:var(--sheet);color:var(--ink);font:700 14px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .fbtn svg{width:16px;height:16px}
  .fnum{min-width:18px;height:18px;border-radius:9px;background:var(--blue);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}
  .fcar{font-size:12px;color:var(--muted)}
  .fsum{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fpanel{display:grid;gap:2px;padding:0 10px 10px}
  .frow{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:40px;border-top:1px solid var(--line)}
  .flab{font-size:14px;font-weight:600;color:var(--ink)}
  .fsel{max-width:62%;border:1px solid var(--line);border-radius:10px;padding:7px 28px 7px 10px;font:600 14px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;color:var(--ink);background:var(--sheet);
    -webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat;text-overflow:ellipsis}
  .fsel.on{border-color:var(--blue);color:var(--blue)}
  .fcount{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
  .freset{flex:none;border:0;background:none;color:var(--blue);font:700 13px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;cursor:pointer;padding:4px 2px}
  .hbtns{margin-left:auto;margin-right:8px;display:flex;gap:8px}
  .x.lens svg{width:17px;height:17px}
  .x.lens{display:grid;place-items:center}
  .sbox{display:flex;align-items:center;gap:8px;border-radius:14px;background:var(--chip);padding:0 12px;margin-bottom:12px}
  .sic svg{width:18px;height:18px;color:var(--muted);display:block}
  .sinp{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px -apple-system,BlinkMacSystemFont,"Inter",sans-serif;padding:13px 0;outline:none}
  .snip{font-size:13px;line-height:1.45;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .snip mark{background:rgba(255,214,10,.45);color:var(--ink);border-radius:3px;padding:0 1px}
  .pweak{display:inline-block;margin-top:5px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:#ffd60a;color:#1d1d1f}
  /* preferiti */
  .iconbtn.star{color:#ffcc00}
  .iconbtn.star .badge-n{background:#ff9f0a}
  .card .cstar{position:absolute;left:auto;right:20px;top:74px;z-index:2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
    background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;cursor:pointer}
  .card .cstar svg{width:24px;height:24px}
  .card .cstar.on{color:#ffd60a;background:rgba(0,0,0,.28)}
  .card.art .top{padding-right:58px}
  .starbtn{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:14px;z-index:12;display:none;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(0,0,0,.45);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);place-items:center}
  .starbtn svg{width:21px;height:21px}
  .starbtn.show{display:grid}
  .starbtn.on{color:#ffd60a}
  @media (min-width:720px){ .starbtn{top:54px;left:calc(50vw - 380px + 14px)} }
  .hero{padding-top:70px}
  .row .picon{color:#fff}
  .row .picon svg{width:22px;height:22px}

   "metodo": "Trial monocentrico (Pechino) su pazienti di almeno 65 anni con frattura intracapsulare trattata con endoprotesi o protesi totale. Il gruppo trattato riceveva 266 mg di bupivacaina liposomiale (30 mL) infiltrati in capsula, muscoli profondi e incisione; il controllo nessuna infiltrazione. Tutti avevano lo stesso percorso: blocco della fascia iliaca sovrainguinale con ropivacaina prima dell'incisione, PCA endovenosa (sufentanil, flurbiprofene) e farmaci di salvataggio a soglia. Pazienti e valutatori in cieco, chirurgo e anestesista no. Nessun calcolo della numerosità e analisi solo per protocollo.",
   "risultati": "Il dolore a riposo a 48 ore, endpoint primario, non cambia (mediana 0 in entrambi). Il dolore in movimento è più basso con la bupivacaina liposomiale a 8, 24 e 48 ore (a 24 ore mediana 3,5 contro 6), ma le differenze restano intorno o sotto la soglia clinica e scompaiono a 72 ore. La PCA consumata è uguale; si riducono solo i salvataggi orali (25 contro 50 MME). Soddisfazione per l'analgesia (90 contro 60 su 100) e sonno della prima notte (7 contro 5 ore) migliorano. La deambulazione resta bassissima in entrambi (3% e 5% a 48 ore, 24% e 18% a 72 ore) e la degenza postoperatoria non cambia.",
   "limiti": "Studio esplorativo, piccolo e senza calcolo della potenza; analisi per protocollo e non intention-to-treat; nessuna correzione per i confronti multipli sui secondari. Il controllo non riceveva alcuna infiltrazione, quindi non si sa se la bupivacaina liposomiale sia meglio della comune bupivacaina. Il BMI mediano era diverso tra i gruppi (21,7 contro 25,8). Il dolore a riposo era già quasi nullo grazie al blocco di fascia iliaca, quindi l'endpoint primario aveva poco margine per migliorare.",

   "nota_affidabilita": "RCT con paziente e valutatore in cieco, ma esplorativo, piccolo, senza calcolo della numerosità e analizzato solo per protocollo.",
   "messaggio_esteso": "Il trial verifica una pratica costosa in un contesto realistico: pazienti anziani con frattura del collo femorale, tutti già con blocco della fascia iliaca sovrainguinale e analgesia multimodale. In queste condizioni il dolore a riposo a 48 ore era praticamente nullo in entrambi i gruppi, e la bupivacaina liposomiale non aveva margine per migliorarlo.\n\nI vantaggi osservati sono reali ma piccoli: meno dolore in movimento tra 8 e 48 ore, meno farmaci di salvataggio orali, più soddisfazione e un sonno migliore la prima notte. Nessuno si è tradotto in una mobilizzazione più precoce o in una dimissione più rapida: a 72 ore camminava meno di un paziente su quattro in entrambi i gruppi. Gli autori riconoscono che le differenze nel dolore in movimento restano intorno o sotto la soglia clinica.\n\nIl disegno va letto con attenzione: il controllo non riceveva alcuna infiltrazione, quindi il confronto è con niente, non con la comune bupivacaina. Gli studi che hanno confrontato le due formulazioni (HEAT nell'endoprotesi per frattura, SPAARK nella protesica elettiva) non hanno trovato vantaggi, e questo trial non cambia il quadro.\n\nNella pratica la priorità resta un buon blocco periferico preoperatorio e un protocollo multimodale ben applicato. La bupivacaina liposomiale potrebbe avere senso in situazioni particolari, per esempio quando il blocco non è disponibile, ma non come aggiunta di routine. Da ricordare anche i limiti statistici: studio esplorativo senza calcolo della potenza, analisi solo per protocollo e BMI diverso tra i gruppi."

   "messaggio_esteso": "Il trial danese è uno dei confronti più puliti tra monocompartimentale e protesi totale: doppio cieco per un anno, chirurghi esperti, pochissimi dati mancanti. Il risultato si presta a due letture.\n\nLa prima: sull'Oxford Knee Score medio la monocompartimentale vince di 3,5 punti, sotto la soglia clinica di 4-5, e il vantaggio si riduce col tempo (2,7 punti a 2 anni). Chi cerca un ginocchio nettamente più funzionale secondo l'OKS non lo trova.\n\nLa seconda: altri esiti, più sensibili nei pazienti che stanno bene, mostrano differenze clinicamente rilevanti. Il Forgotten Joint Score è migliore di 14 punti, i sintomi KOOS di 10, l'articolarità di circa 7 gradi, e il recupero è più rapido con degenza più breve. Anche i reinterventi sono meno frequenti (2,3% contro 6,9%), ma soprattutto per le mobilizzazioni in narcosi dopo protesi totale; le revisioni vere sono simili.\n\nNella pratica, con un'artrosi anteromediale isolata e un chirurgo esperto della tecnica, la monocompartimentale offre un ginocchio più naturale e un recupero più veloce. Il prezzo noto dai registri è un rischio di revisione più alto a lungo termine: a 2 anni questo trial non può vederlo, e la risposta arriverà dal follow-up previsto fino a 20 anni.\n\nConta anche la selezione: molti pazienti hanno rifiutato di partecipare perché non volevano una protesi totale, e l'impianto studiato era un Oxford non cementato a menisco mobile. I risultati non si estendono automaticamente ad altri impianti o a centri con minore esperienza."

   "messaggio_esteso": "Il Dupuytren è una malattia cronica, e qualsiasi trattamento corregge la contrattura senza curare la diatesi. La domanda pratica è quanto dura la correzione e se la scelta della tecnica cambia l'evoluzione nelle altre dita. DETECT è uno dei pochi trial a tre bracci con valutatori in cieco e risponde a entrambe le domande.\n\nSul dito trattato la fasciectomia limitata vince in modo netto: meno ripresa della contrattura tra 3 mesi e 2 anni e quasi nessun ritrattamento, contro circa un dito su dieci con ago o collagenasi. Le due tecniche percutanee si comportano in modo simile tra loro, quindi la scelta tra ago e collagenasi può basarsi su costi, disponibilità ed esperienza. Sulle dita non trattate, invece, la tecnica non cambia nulla: la chirurgia non 'protegge' la mano dalla progressione della malattia.\n\nI fattori di rischio aiutano a personalizzare. Il paziente giovane, fumatore, con mignolo interessato e contrattura prevalente dell'IFP progredisce di più ed è quello che trae più vantaggio dalla durata della chirurgia. Nel paziente anziano con corda ben definita sulla MF, dove la recidiva pesa meno e la convalescenza conta di più, le tecniche percutanee restano una scelta eccellente: recupero rapido, ambulatoriale, ripetibili.\n\nNel colloquio con il paziente vale la pena spiegare questo compromesso: con l'ago o la collagenasi si torna prima alle attività ma c'è circa una probabilità su dieci di dover ripetere il trattamento entro 2 anni; con la chirurgia la convalescenza è più lunga ma il risultato è più stabile. I dati a 5 e 10 anni dello stesso trial diranno se il divario si allarga."

   "messaggio_esteso": "La WALANT è ormai molto diffusa nella chirurgia della mano, e il tunnel carpale è l'intervento dove viene usata più spesso. Questa meta-analisi ha il merito di considerare solo trial randomizzati e una sola procedura, evitando di mescolare interventi diversi come fanno molte revisioni precedenti.\n\nIl beneficio più solido riguarda il dolore durante l'intervento: circa un punto e mezzo in meno su dieci, con risultati coerenti tra gli studi. Gran parte del disagio delle tecniche tradizionali viene dal laccio al braccio, che diventa doloroso dopo pochi minuti, e la WALANT lo elimina. Anche la soddisfazione è più alta. Il dolore nelle prime ore dopo l'intervento tende a essere più basso, soprattutto nella via aperta, ma i dati sono eterogenei.\n\nSul piano tecnico il prezzo da pagare è modesto. Nella via aperta l'intervento dura un po' di più e alcuni chirurghi riferiscono una visibilità leggermente peggiore, ma nessun intervento è stato compromesso. Qualche accorgimento aiuta: aspettare 20-30 minuti dopo l'infiltrazione per il massimo effetto vasocostrittore, tamponare la soluzione con bicarbonato e iniettare lentamente con un ago sottile per ridurre il dolore della puntura.\n\nIl possibile vantaggio funzionale a 3 mesi va preso con cautela: viene da soli due trial e la differenza sul Boston è piccola. Resta il fatto che la WALANT è almeno equivalente alle alternative, è più gradita dai pazienti ed evita l'anestesista e il digiuno. Le eccezioni sono i pazienti molto ansiosi o poco collaboranti, nei quali un'anestesia regionale o una sedazione possono essere ancora preferibili."

   "nota_affidabilita": "RCT con calcolo della numerosità, follow-up del 96% e interpretazione dei dati in cieco; limite: monocentrico e senza cieco per pazienti e valutatori.",
   "messaggio_esteso": "Per decenni la Weber B 'instabile' allo stress test è stata considerata un'indicazione chirurgica quasi automatica, nel timore che la lesione del deltoideo porti a una sublussazione occulta del talo nel gesso. SUPER-FIN mette alla prova proprio questa paura: su oltre 600 Weber B congruenti valutate consecutivamente tra questo trial e il trial gemello, nessuna ha sviluppato un'incongruenza occulta nel gesso.\n\nIl risultato funzionale è netto. A 2 anni gesso e placca danno lo stesso punteggio, e l'intervallo di confidenza esclude un vantaggio clinicamente importante della chirurgia indipendentemente dal margine scelto. Gli eventi avversi sono invece concentrati nel gruppo operato, soprattutto per le rimozioni di mezzi di sintesi e le relative infezioni. Anche l'artrosi radiografica a 2 anni non differisce.\n\nNella pratica il messaggio è spostare l'attenzione dall'instabilità alla congruenza. Un approccio sostenibile è: gesso sotto il ginocchio, carico precoce come tollerato e radiografia in carico entro circa 2 settimane, con il gesso in sede. Se la mortasa resta congruente si prosegue in modo conservativo; se compare uno slargamento dello spazio chiaro mediale si valuta la chirurgia. Gli studi con radiografie in carico precoci riportano un tasso di conversione basso.\n\nRestano da valutare caso per caso le situazioni non coperte dal trial: fratture bimalleolari o equivalenti con mortasa già incongruente, lussazioni, neuropatia diabetica, pazienti che non possono garantire i controlli. Va anche spiegato al paziente che il gesso dura 6 settimane in entrambi i casi, quindi la chirurgia non accorcia l'immobilizzazione ma aggiunge rischi; l'informazione sui tempi di ritorno al lavoro non viene però da questo studio."

   "metodo": "Randomizzazione 1:1 centralizzata via web, stratificata. Gruppo di controllo: una seduta di 20 minuti con fisioterapista (educazione, esercizi a casa, attività fisica, peso). Gruppo tutore: stessa seduta più fornitura del tutore scelto in base al compartimento prevalente (clinica e radiografie), controllo a 2 settimane, colloquio motivazionale breve e SMS di promemoria per 6 mesi. Endpoint primario KOOS-5 a 6 mesi; MCID stimata intorno a 8 punti. Analisi con modelli misti longitudinali.",
   "risultati": "A 6 mesi il KOOS-5 migliorava di 3,4 punti in più con il tutore (IC 95% 0,96-5,82; effect size 0,24), con risultati simili a 3 mesi (+3,7). A 12 mesi il vantaggio si riduceva a 2,7 punti e non era più significativo. L'effetto maggiore era sul dolore KOOS (+6,1 a 6 mesi, ancora +4,8 a 12 mesi) e sulle attività quotidiane (+5,2). Il dolore sotto carico (0-10) migliorava di 0,8 punti in più. L'aderenza al tutore era un determinante importante del risultato. Effetti avversi lievi: arrossamento o irritazione cutanea fino al 20%, vesciche fino al 4%.",

   "messaggio_esteso": "Il tutore per la gonartrosi è prescritto spesso ma le prove a sostegno erano scarse e di qualità modesta. PROP OA è il trial più grande finora e ha cercato di dare al tutore le migliori possibilità: scelta del modello in base al compartimento, controllo dell'adattamento a 2 settimane e un programma strutturato per far sì che i pazienti lo portino davvero.\n\nIl risultato è un beneficio reale ma piccolo. Il punteggio globale migliora di circa 3-4 punti nei primi 6 mesi, la metà di quanto gli autori consideravano clinicamente importante, e il vantaggio si riduce a un anno. L'effetto più consistente è sul dolore, che migliora di circa 6 punti su 100 e resta meglio anche a 12 mesi, e sulle attività quotidiane. In pratica il tutore aggiunge qualcosa all'esercizio, non lo sostituisce.\n\nL'aderenza conta molto: chi porta il tutore ne trae più beneficio, e il trial ha usato colloqui motivazionali e SMS per sostenerla. Nella pratica quotidiana, senza questo supporto, il beneficio medio potrebbe essere ancora più piccolo. Gli effetti avversi sono lievi ma frequenti: circa un paziente su cinque riferisce arrossamento o irritazione della pelle, e questo è un motivo comune di abbandono.\n\nIn ambulatorio può essere utile per il paziente con gonartrosi da lieve a moderata, motivato, con dolore sotto carico prevalente in un compartimento (scarico per il varo mediale, tutore rotuleo per il femoro-rotuleo), come parte di un programma che resta centrato su esercizio, attività fisica e controllo del peso. Conviene presentarlo come un aiuto per il dolore, provarlo per qualche settimana e sospenderlo se non porta beneficio o non viene tollerato."

   "teaser": "Con le assenze dal lavoro la chirurgia è più efficace e meno costosa; guardando solo i costi sanitari vince il tutore.",
   "domanda": "Nella frattura diafisaria omerale dell'adulto, la fissazione chirurgica è costo-efficace rispetto al tutore funzionale, considerando sia i costi sanitari sia quelli per la società (assenze dal lavoro)?",
   "metodo": "Analisi economica accanto al trial FISH (2012-2018), con follow-up di 2 anni. Costi sanitari diretti dai sistemi di prezzo ospedalieri e dai registri nazionali delle prescrizioni; perdite di produttività calcolate sui giorni di assenza dal lavoro registrati centralmente, a 222 euro al giorno. Efficacia in QALY con lo strumento 15D, escludendo le prime 6 settimane. Esito primario: beneficio monetario netto incrementale a una soglia di 35.000 euro per QALY, con bootstrap e analisi di sensibilità.",

   "nota_affidabilita": "Analisi economica prespecificata con dati di registro oggettivi, ma su un campione piccolo e selezionato e in un sistema sanitario specifico.",
   "messaggio_esteso": "La frattura diafisaria dell'omero è uno dei classici dilemmi tra chirurgia e trattamento conservativo. Il tutore funzionale secondo Sarmiento evita i rischi dell'intervento, compresa la paralisi iatrogena del radiale, e in molti casi consolida bene; ma una quota consistente di pazienti non consolida e arriva comunque alla chirurgia, dopo mesi di disabilità.\n\nQuesta analisi del trial FISH misura proprio quel costo nascosto. Dal punto di vista della società, includendo le giornate di lavoro perse, la chirurgia risulta più efficace e meno costosa. La differenza nasce quasi tutta dal sottogruppo con tutore che ha dovuto essere operato (circa un paziente su tre), che ha avuto costi medi doppi e assenze molto più lunghe. Guardando solo il bilancio dell'ospedale, invece, il tutore è nettamente più economico.\n\nPer la pratica clinica il dato utile è quello sul tasso di pseudoartrosi: il tutore rimane conveniente solo se meno del 15% dei pazienti non consolida, mentre nel trial il tasso di conversione è stato molto più alto. Questo suggerisce di riconoscere presto chi sta andando verso la pseudoartrosi (assenza di callo e movimento al focolaio a 6 settimane) e di non prolungare il tutore oltre il necessario.\n\nNel colloquio conviene presentare entrambe le strade con onestà. Per il lavoratore manuale o autonomo che deve rientrare presto, la placca o il chiodo offrono un percorso più prevedibile. Per il pensionato o chi non ha urgenza di rientro, il tutore resta una scelta sensata, sapendo che circa uno su tre potrebbe aver bisogno dell'intervento più avanti. I numeri vengono però da un sistema scandinavo con retribuzioni e costi diversi dai nostri."

   "domanda": "Dopo una microdiscectomia lombare per radicolopatia, prescrivere limiti su posizione seduta, sollevamento di pesi e attività pesanti per il primo mese migliora gli esiti o riduce le recidive rispetto a nessuna restrizione?",
   "metodo": "Randomizzazione 1:1 con busta consegnata subito dopo l'intervento. Gruppo con restrizioni: seduti al massimo 15-30 minuti ogni 2 ore, niente sollevamenti sopra 5 kg, niente lavori domestici pesanti per un mese. Gruppo senza restrizioni: ritorno alle attività come tollerato. Tutti indossavano un accelerometro per il primo mese. Valutazione neurologica in cieco e questionari fino a 12 mesi. Endpoint primario composito a 12 mesi: miglioramento clinicamente rilevante di dolore lombare, dolore alla gamba e ODI, senza ulteriori interventi.",
   "risultati": "A un anno l'endpoint composito era raggiunto dal 41,6% con restrizioni e dal 36,4% senza (p 0,45). Le recidive di ernia erano 10,1% contro 14,1% e i reinterventi 2,9% contro 5,5%, senza differenze significative. ODI, dolore lombare e radicolare miglioravano in modo simile (ODI da circa 46-51% a circa 17% in entrambi i gruppi). Gli accelerometri hanno mostrato che solo il 10% dei pazienti con restrizioni le rispettava e che il tempo seduto era identico nei due gruppi (circa 4.100 minuti a settimana). Anche analizzando i pazienti in base all'aderenza effettiva non emergevano differenze.",

   "nota_affidabilita": "RCT multicentrico con misura oggettiva dell'aderenza, ma con molti persi al follow-up e numerosità al limite.",
   "messaggio_esteso": "Le istruzioni dopo una microdiscectomia variano molto da chirurgo a chirurgo: c'è chi vieta di stare seduti per settimane e chi lascia fare. Le restrizioni nascono dal timore di una recidiva precoce attraverso il difetto dell'anulus, ma le prove a sostegno sono poche e i pazienti ricevono spesso messaggi contraddittori.\n\nQuesto trial ha due risultati. Il primo è clinico: a un anno dolore, disabilità, recidive e reinterventi sono simili con o senza restrizioni, e le recidive sono anzi numericamente un po' più frequenti nel gruppo libero ma senza differenza significativa. Il secondo è comportamentale e forse più interessante: grazie agli accelerometri si vede che solo un paziente su dieci rispettava davvero il limite sulla posizione seduta, e che i due gruppi passavano lo stesso tempo seduti.\n\nIn altre parole le restrizioni, così come vengono date nella pratica, non cambiano il comportamento dei pazienti e quindi non possono cambiarne gli esiti. Si possono sostituire con istruzioni semplici e coerenti: camminare presto, riprendere gradualmente le attività secondo il dolore, evitare solo gli sforzi che provocano sintomi. Questo riduce l'ansia del paziente e facilita il lavoro di infermieri e fisioterapisti.\n\nC'è una cautela: con molti persi al follow-up e una numerosità al limite, lo studio non può escludere una piccola differenza nel rischio di recidiva. Nei pazienti ad alto rischio (grande difetto dell'anulus, lavori molto pesanti) qualche prudenza nei primi giorni resta ragionevole, purché sia spiegata e realistica."

   "metodo": "Trial danese con randomizzazione 1:1:1 entro 7 giorni dal trauma, tutti inizialmente in equino. Nel braccio CARTA l'ecografia valutava prima la sovrapposizione dei monconi (chirurgia se meno del 25% delle fibre nella sezione trasversa) e poi l'allungamento del tendine rispetto al controlaterale (chirurgia se almeno 7%). Chirurgia: sutura aperta con doppio Kessler entro 2 settimane. Stessa immobilizzazione per tutti: gesso in equino 3 settimane, poi tutore per 6 settimane con carico progressivo e riabilitazione standardizzata. Esito primario: Heel-Rise Work Test (rapporto tra arto leso e sano) a 12 mesi, valutatore in cieco; secondari ATRS, angolo di riposo del tendine, lunghezza ecografica, rotture e complicanze.",
   "risultati": "L'algoritmo ha indicato la chirurgia nel 64% dei casi. A 12 mesi la funzione (Heel-Rise Work Test) non differiva: 69% del lato sano con CARTA, 64% con il conservativo e 67% con la chirurgia per tutti. Le nuove rotture sono state 3% con CARTA, 11% con il conservativo e 1% con la chirurgia (CARTA contro conservativo p=0,03). L'ATRS a 12 mesi era migliore di 8 punti con CARTA rispetto al conservativo, appena sopra la soglia clinica di 7. Rispetto alla chirurgia per tutti, CARTA non differiva in nessun esito ma ha evitato circa un terzo degli interventi. Un'infezione profonda nel gruppo chirurgico ha richiesto la rimozione dell'intero tendine; un'embolia polmonare nel gruppo CARTA e una nel conservativo.",

   "nota_affidabilita": "RCT multicentrico a tre bracci, ben dimensionato per l'esito primario e con valutatori in cieco; i vantaggi dell'algoritmo vengono però da esiti secondari, da leggere come esplorativi.",
   "messaggio_esteso": "Sul trattamento della rottura acuta dell'Achille il quadro è noto da anni: la chirurgia riduce le nuove rotture, il conservativo evita infezioni e lesioni del surale, la funzione a distanza è simile. CARTA prova a superare il dilemma scegliendo il trattamento sul singolo tendine, con un'ecografia in due passaggi: se i monconi non si sovrappongono o il tendine è già allungato di almeno il 7% rispetto all'altro lato, si opera; altrimenti si tratta in gesso e tutore.\n\nIl risultato principale va detto chiaramente: la funzione a 12 mesi è uguale nei tre gruppi, quindi l'algoritmo non migliora il recupero della forza del tricipite. I vantaggi stanno altrove. Rispetto al conservativo per tutti, le nuove rotture scendono dall'11% al 3% e l'ATRS migliora di 8 punti; rispetto alla chirurgia per tutti, i risultati sono sovrapponibili ma con un terzo di interventi in meno. Gli autori ricordano anche il costo di un'operazione non necessaria: nel braccio chirurgico un'infezione profonda ha portato alla perdita del tendine.\n\nPrima di adottarlo servono alcune condizioni. L'ecografia va fatta con il paziente prono, ginocchio leggermente flesso e caviglia in lieve equino, misurando la lunghezza dal calcagno al gastrocnemio mediale su entrambi i lati: è una tecnica da imparare, non un'ecografia diagnostica qualsiasi. Il protocollo prevedeva inoltre 9 settimane di immobilizzazione per tutti, più di quanto si usi oggi dopo la sutura, e i vantaggi vengono da esiti secondari non corretti per i confronti multipli.\n\nIn pratica il trial rafforza l'idea che non esista un trattamento unico giusto per tutti. Dove l'ecografia è disponibile in ambulatorio entro pochi giorni dal trauma, valutare sovrapposizione e allungamento aiuta a spiegare al paziente perché si propone la chirurgia o il conservativo. Per l'atleta con monconi distanti la chirurgia resta la scelta più protettiva; per chi ha monconi a contatto in equino il trattamento funzionale è sicuro."

   "metodo": "Revisione registrata su PROSPERO, ricerca in 7 banche dati fino a novembre 2025, solo RCT prospettici. Meta-analisi a rete frequentista a effetti casuali con la vite su 3 corticali come riferimento. Esito principale OMAS a 12 mesi letto rispetto alla differenza minima clinicamente importante (10 punti); poi AOFAS, malriduzione e reinterventi, distinguendo la rimozione programmata delle viti dai reinterventi non pianificati. Rischio di bias con RoB 2 e certezza delle prove con CINeMA; analisi di sensibilità per diametro delle viti e per malriduzione valutata solo con TC.",

   "messaggio_esteso": "La stabilizzazione della sindesmosi è una delle scelte più discusse nella chirurgia delle fratture di caviglia. Questa meta-analisi a rete mette a confronto tutte le opzioni studiate in trial randomizzati e ha due meriti: legge i risultati rispetto alla soglia clinica e separa i reinterventi veri dalla rimozione programmata delle viti, che nei confronti precedenti gonfiava lo svantaggio delle viti.\n\nIl suture-button esce come il costrutto migliore, ma di poco. Cinque punti OMAS in più a un anno sono statisticamente significativi ma clinicamente modesti, l'AOFAS non cambia e i reinterventi non pianificati sono simili. Il dato più interessante riguarda la malriduzione: con la fissazione dinamica è meno frequente, soprattutto quando la riduzione è valutata con la TC. Il perone sembra centrarsi meglio nell'incisura, e una sindesmosi malridotta è uno dei principali determinanti di dolore cronico e artrosi.\n\nNella pratica il messaggio è prudente. Sia il suture-button sia la vite su 3 corticali da 3,5 mm sono scelte ragionevoli; il vantaggio concreto della fissazione dinamica è evitare un secondo intervento dove si rimuovono le viti di routine. La singola vite da 4,5 mm su 4 corticali è il costrutto con i risultati peggiori, anche se non si può distinguere l'effetto del diametro da quello della presa corticale.\n\nQualunque impianto si scelga, l'obiettivo resta la riduzione anatomica: controllo diretto dell'incisura, confronto con il lato sano e, nei casi dubbi, TC postoperatoria. Gli autori ricordano anche che i follow-up a 5-6 anni mostrano differenze che si attenuano: il suture-button non va venduto al paziente come garanzia di un risultato migliore a lungo termine."

   "domanda": "Negli adulti fino a 65 anni con gonartrosi sintomatica candidati a protesi, la distrazione articolare del ginocchio con fissatore esterno per 6 settimane è non inferiore alla protesi per il dolore a 12 mesi?",
   "metodo": "Trial pragmatico britannico (Leeds), randomizzazione centralizzata stratificata per gravità radiografica. Distrazione di 5 mm con fissatore esterno (KneeReviver o Ilizarov) per 6 settimane, carico completo, rimozione in anestesia con mobilizzazione del ginocchio; controllo con protesi totale secondo la pratica abituale. Esclusi deformità da correggere, flessum oltre 10° e peso oltre 120 kg. Esito primario KOOS dolore a 12 mesi; il trial, chiuso per il blocco della chirurgia elettiva durante il COVID, riporta solo statistiche descrittive.",
   "risultati": "Su 350 pazienti valutati solo 24 sono stati randomizzati, soprattutto per l'età oltre i 65 anni o per sintomi non sufficienti per una protesi. A 12 mesi il KOOS dolore mediano è passato da 38,9 a 55,6 con la distrazione e da 30,6 a 75,0 con la protesi; anche Oxford Knee Score (27 contro 37), qualità di vita e timed up-and-go favorivano la protesi. Con la distrazione: due infezioni dei fori dei pin e una frattura del femore su un foro di pin dopo una caduta, trattata con chiodo retrogrado. Costo della distrazione circa 10.400 sterline contro circa 6.100 per la protesi.",

   "nota_affidabilita": "Trial interrotto con 24 pazienti invece di 344, senza analisi comparativa: utile come spunto sulla tecnica e sui suoi problemi pratici, non come prova di efficacia.",
   "messaggio_esteso": "La distrazione articolare del ginocchio nasce da un'idea attraente: togliere carico alla cartilagine per sei settimane con un fissatore esterno, permettendo una parziale riparazione e rimandando di anni la protesi nel paziente giovane, che ha un rischio di revisione nel corso della vita di circa uno su tre. Finora i dati venivano quasi tutti da un unico gruppo olandese.\n\nKARDS doveva essere la prova indipendente su larga scala, ma il blocco della chirurgia elettiva durante la pandemia ha fermato il reclutamento a 24 pazienti. I numeri quindi descrivono, non dimostrano. Entrambi i gruppi migliorano, ma con la protesi il miglioramento è molto più ampio in dolore, Oxford score e qualità di vita, e il timed up-and-go migliora solo dopo la protesi.\n\nIl trial è utile soprattutto per capire la tecnica nella vita reale. Bisogna gestire sei settimane di fissatore con medicazioni dei pin, una seconda anestesia per la rimozione con mobilizzazione, il rischio di infezione dei fori e, come è successo a un paziente, di fratture da concentrazione di sforzi sui tragitti dei pin, che possono complicare anche una futura protesi. I costi iniziali sono risultati più alti della protesi. Interessante anche il dato sul reclutamento: tra i pazienti idonei l'adesione è stata alta, segno che molti giovani, spesso lavoratori manuali, cercano davvero un'alternativa che conservi l'articolazione.\n\nPer ora la distrazione non è un'opzione da proporre al di fuori di studi clinici. Nel paziente giovane restano da preferire le opzioni consolidate, scelte in base al quadro (osteotomia, protesi monocompartimentale o totale); la distrazione potrà avere un ruolo se trial adeguati confermeranno i dati olandesi."

  function lev1(a,b){if(Math.abs(a.length-b.length)>1)return false;var i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1}
  function parolaCombacia(q,d){if(d===q)return 3;var r=radice(q);if(r.length>=3&&d.indexOf(r)===0)return 2;if(q.length>=5&&lev1(q,d))return 1;return 0}
  var CAMPI=[["titolo",6],["titolo_orig",3],["teaser",3],["gruppo",2],["messaggio",2],["domanda",1.5],["risultati",1.2],["messaggio_esteso",1],["metodo",1],["limiti",1],["contesto",1],["nota_affidabilita",0.8],["autori",2],["rivista",2],["tipo",1.5],["campione",1]];
  var INDICE=null;
  function indicizza(){INDICE=[];lez.forEach(function(l){l.articoli.forEach(function(a){
    var f={};CAMPI.forEach(function(c){var n=nt(a[c[0]]);f[c[0]]={n:n,w:n.split(" ")}});
    var tn=nt(tema(a)[0]);f.tema={n:tn,w:tn.split(" ")};
    INDICE.push({lez:l.n,a:a,f:f})})})}
  /* query -> lista di "concetti"; ogni concetto = alternative (frasi o parole) */
  function analizza(q){
    var frasi=[],m,re=/"([^"]+)"/g; while((m=re.exec(q))){frasi.push(nt(m[1]))}
    var resto=" "+nt(q.replace(/"[^"]*"/g," "))+" ", concetti=[];
    frasi.forEach(function(f){if(f)concetti.push({alt:[f],frase:true})});
    SINONIMI.forEach(function(g){g.forEach(function(s){if(s.indexOf(" ")>0&&resto.indexOf(" "+s+" ")>=0){concetti.push({alt:g,frase:false});resto=resto.replace(" "+s+" "," ")}})});
    resto.trim().split(" ").forEach(function(w){if(!w||STOP[w])return;
      var g=null;SINONIMI.forEach(function(x){if(!g&&x.indexOf(w)>=0)g=x});
      concetti.push({alt:g?g:[w],frase:false,parola:w})});
    return concetti;
  }
  function punteggioCampo(alt,campo){
    var best=0;alt.forEach(function(s,ix){var peso=ix===0?1:0.8;
      if(s.indexOf(" ")>0){if((" "+campo.n+" ").indexOf(" "+s+" ")>=0)best=Math.max(best,3*peso)}
      else campo.w.forEach(function(d){var c=ix===0?parolaCombacia(s,d):(d===s?3:0);if(c)best=Math.max(best,c*peso)})});
    return best;
  }
  function cerca(q){
    if(!INDICE)indicizza();
    var concetti=analizza(q); if(!concetti.length)return null;
    var qn=nt(q.replace(/"/g,"")), out=[];
    INDICE.forEach(function(it){
      var tot=0,ok=true;
      concetti.forEach(function(c){
        var alt=c.parola&&c.alt.indexOf(c.parola)>0?[c.parola].concat(c.alt.filter(function(x){return x!==c.parola})):c.alt;
        var s=0;CAMPI.forEach(function(cp){var v=punteggioCampo(alt,it.f[cp[0]]);if(v)s+=v*cp[1]});
        var vt=punteggioCampo(alt,it.f.tema);if(vt)s+=vt*3;
        if(!s)ok=false; tot+=s;
      });
      if(!ok)return;
      if(qn.indexOf(" ")>0)CAMPI.forEach(function(cp){if(it.f[cp[0]].n.indexOf(qn)>=0)tot+=4*cp[1]});
      out.push({it:it,score:tot,concetti:concetti});
    });
    out.sort(function(a,b){return b.score-a.score});
    return out;
  }
  function estratto(it,concetti){
    var campi=["risultati","messaggio","domanda","messaggio_esteso","metodo","limiti","contesto","teaser"];
    function parolaOk(wn){return concetti.some(function(c){return c.alt.some(function(s){return s.indexOf(" ")>0?s.split(" ").indexOf(wn)>=0:parolaCombacia(s,wn)>0})})}
    for(var i=0;i<campi.length;i++){
      var testo=it.a[campi[i]]; if(!testo)continue;
      var parole=testo.split(/(\s+)/), pos=-1, acc=0;
      for(var j=0;j<parole.length;j++){var wn=nt(parole[j]);if(wn&&!STOP[wn]&&parolaOk(wn)){pos=acc;break}acc+=parole[j].length}
      if(pos<0)continue;
      var ini=Math.max(0,pos-60), fin=Math.min(testo.length,pos+120);
      while(ini>0&&testo[ini-1]!==" ")ini--; while(fin<testo.length&&testo[fin]!==" ")fin++;
      var pezzo=(ini>0?"…":"")+testo.slice(ini,fin)+(fin<testo.length?"…":"");
      var div=el("div","snip");
      pezzo.split(/(\s+)/).forEach(function(w){var wn=nt(w);if(wn&&!STOP[wn]&&parolaOk(wn)){div.appendChild(el("mark",null,w))}else div.appendChild(document.createTextNode(w))});
      return div;
    }
    return null;
  }
  var GR_CERCA=[G_AREA,G_LETTO,G_AFF,G_AGG,G_PREF], FCERCA=carica("ortopedia-filtri-cerca",GR_CERCA), fCercaAperto=false, testoCerca="";
  function apriCerca(opz){

    var inp=el("input","sinp"); inp.type="search"; inp.placeholder="Parola o frase, es. tunnel carpale, \"doppia mobilità\""; inp.value=testoCerca;
    inp.setAttribute("aria-label","Cerca negli articoli"); inp.setAttribute("enterkeyhint","search"); sb.appendChild(inp);
    p.appendChild(sb);
    var fbox=el("div"), res=el("div");
    p.appendChild(fbox); p.appendChild(res);

      onToggle:function(v){fCercaAperto=v;disegnaFiltri()},onChange:function(){disegnaFiltri();aggiorna()}}))}
    function aggiorna(){

      res.appendChild(el("div","fcount",q?(righe.length?righe.length+(righe.length===1?" risultato":" risultati")+", dal più pertinente":"Nessun risultato"):"Tutti gli articoli ("+righe.length+"): scrivi una parola o una frase per cercare"));
      if(q&&!righe.length){res.appendChild(el("div","empty","Prova con un sinonimo, una parola più breve o togli qualche filtro."));return}
      var box=el("div","list"); box.style.marginTop="10px";

  }

  /* ---------- calendario ---------- */
  var mese=null;
  function fatteSett(lun){var a=iso(lun),b=iso(new Date(lun.getFullYear(),lun.getMonth(),lun.getDate()+6));
    return lez.filter(function(l){return l.data>=a&&l.data<=b&&lezioneLetta(l)}).length}
  function settimanaOk(lun){return fatteSett(lun)>=2}
  function apriCalendario(){
    if(!mese){var l=lez[shown]||lez[latest];var d=l?pd(l.data):new Date();mese=new Date(d.getFullYear(),d.getMonth(),1)}
    sheet.innerHTML=""; sheet.style.removeProperty("--accent");
    sheet.appendChild(intestazione("Calendario"));
    var p=el("div","pad");
    var fatte=lez.filter(lezioneLetta).length;
    var tiles=el("div","tiles");
    [[settimaneOk(),"Settimane complete"],[serie(),"Settimane di fila"],[fatte,"Lezioni lette"]].forEach(function(t){var x=el("div","tile");x.appendChild(el("div","v",String(t[0])));x.appendChild(el("div","l",t[1]));tiles.appendChild(x)});
    p.appendChild(tiles);
    var nav=el("div","calnav"),pr=el("button",null,"‹"),nx=el("button",null,"›");
    pr.setAttribute("aria-label","Mese precedente");nx.setAttribute("aria-label","Mese successivo");
    pr.addEventListener("click",function(){mese=new Date(mese.getFullYear(),mese.getMonth()-1,1);apriCalendario()});
    nx.addEventListener("click",function(){mese=new Date(mese.getFullYear(),mese.getMonth()+1,1);apriCalendario()});
    nav.appendChild(pr);nav.appendChild(el("b",null,MESI[mese.getMonth()]+" "+mese.getFullYear()));nav.appendChild(nx);p.appendChild(nav);
    var hd=el("div","calhead");["L","M","M","G","V","S","D",""].forEach(function(g){hd.appendChild(el("span",null,g))});p.appendChild(hd);
    var perGiorno={}; lez.forEach(function(l){perGiorno[l.data]=l});
    var oggi=iso(new Date()), start=lunedi(mese), grid=el("div","calgrid");
    while(true){

      var row=el("div","calrow"+(nf>=2?" ok":"")+(iso(start)===iso(lunedi(new Date()))?" cur":""));
      for(var i=0;i<7;i++){(function(d){
        var key=iso(d), l=perGiorno[key], fatto=l&&lezioneLetta(l), wd=d.getDay();
        var slot=!l&&(wd===1?" slotm":wd===4?" slotg":"");
        var c=el("div","calday"+(d.getMonth()!==mese.getMonth()?" out":"")+(key===oggi?" today":"")+(l?" has "+(fatto?"done":"todo"):slot));
        c.appendChild(el("span",null,String(d.getDate())));
        if(l){c.setAttribute("role","button");c.setAttribute("aria-label","Lezione "+l.n+(fatto?", letta":", da leggere"));
          c.addEventListener("click",function(){shown=lez.indexOf(l);chiudi();render();window.scrollTo({top:0,behavior:"smooth"})})}
        row.appendChild(c);
      })(new Date(start.getFullYear(),start.getMonth(),start.getDate()+i))}
      row.appendChild(el("div","calmark"+(nf===1?" half":""),nf>=2?"✓":nf===1?"½":""));
      grid.appendChild(row);

      if(start.getMonth()!==mese.getMonth()&&start>mese)break;
    }
    p.appendChild(grid);
    var lg=el("div","legend");
    [["var(--green)","Lezione letta (tutte le schede aperte)"],["var(--orange)","Lezione da leggere"],["#00a389","Lunedì: ginocchio, caviglia e piede"],["#0a84ff","Giovedì: ortopedia generale (tutto il resto)"],["rgba(48,209,88,.25)","Settimana completa (2 lezioni lette) ✓ · ½ = una sola"]].forEach(function(x){var s=el("span");var i=el("i");i.style.background=x[0];s.appendChild(i);s.appendChild(document.createTextNode(x[1]));lg.appendChild(s)});
    p.appendChild(lg);
    sheet.appendChild(p); if(!sheet.classList.contains("open"))apri();
  }
  function settimaneOk(){var s={};lez.forEach(function(l){if(lezioneLetta(l)){var k=iso(lunedi(pd(l.data)));s[k]=(s[k]||0)+1}});
    return Object.keys(s).filter(function(k){return s[k]>=2}).length}

  /* ---------- nuova lezione ---------- */
  function apriNuova(){
    sheet.innerHTML=""; sheet.style.removeProperty("--accent");
